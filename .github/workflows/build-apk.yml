name: Build Android APK (Flutter)

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Analyze, Test & Build APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze code
        run: flutter analyze --no-fatal-infos

      - name: Run unit tests
        run: flutter test

      - name: Build release APK
        run: |
          flutter build apk --release
          cp build/app/outputs/flutter-apk/app-release.apk "build/app/outputs/flutter-apk/KnownRoads-v1.0.${{ github.run_number }}.apk"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: KnownRoads-v1.0.${{ github.run_number }}
          path: build/app/outputs/flutter-apk/KnownRoads-v1.0.${{ github.run_number }}.apk

      - name: Publish GitHub Release with APK
        if: github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: Known Roads v1.0.${{ github.run_number }} (Android APK)
          body: |
            Build automático v1.0.${{ github.run_number }} do Known Roads (Forza Horizon Road Discovery + KTM 390 Duke Edition).
            Baixe `KnownRoads-v1.0.${{ github.run_number }}.apk` abaixo para instalar direto no Android.
          files: build/app/outputs/flutter-apk/KnownRoads-v1.0.${{ github.run_number }}.apk
